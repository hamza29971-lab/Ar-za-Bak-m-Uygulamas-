name: nimo_arizabakim
description: "NIMO Arıza Bakım Tablet Uygulaması"
publish_to: 'none'
version: 1.0.0+69

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  intl: 0.20.2
  permission_handler: ^11.3.1
  image_picker: ^1.2.3
  http: ^1.6.0
  # Yuklenen gorselin Content-Type basligi icin (http ile zaten geliyor).
  http_parser: ^4.1.2
  battery_plus: ^7.1.1
  path_provider: ^2.1.6
  open_file: ^4.0.0
  connectivity_plus: ^7.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/anasayfa/
    - assets/images/sol/
    - assets/images/sag/
    - assets/version.txt


